<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRIME / Spend</title>
  <link
    rel="stylesheet"
    as="style"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
  />
  <style>
    :root {
      --bg: #ffffff;
      --text: #0a0a0a;
      --secondary: #6b6b6b;
      --divider: #e5e5e5;
      --card: #f7f7f7;
      --danger: #c53030;
      --income: #2c7a4f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; }

    main { max-width: 880px; margin: 0 auto; padding: 48px 32px 96px; }

    /* Header */
    .header { padding-bottom: 36px; border-bottom: 1px solid var(--divider); }
    .header-top {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 32px;
    }
    .title { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
    .month { font-size: 13px; color: var(--secondary); font-variant-numeric: tabular-nums; }
    .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .summary-label {
      font-size: 11px; color: var(--secondary);
      text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px;
    }
    .summary-value {
      font-size: 28px; font-weight: 600;
      font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
    }
    .summary-value.neg { color: var(--danger); }

    /* Sections */
    section { padding-top: 44px; }
    .section-title {
      font-size: 11px; font-weight: 600; color: var(--secondary);
      text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 14px;
    }

    /* Form */
    .form { background: var(--card); border-radius: 8px; padding: 24px; }
    .form-row {
      display: grid; gap: 12px; margin-bottom: 12px;
      grid-template-columns: 150px 160px 1fr 1fr;
    }
    .form-row-full { grid-template-columns: 1fr; }
    .field { display: flex; flex-direction: column; }
    .field-label {
      font-size: 11px; color: var(--secondary);
      text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px;
    }
    .input, .select {
      height: 40px; padding: 0 12px;
      background: #ffffff; border: 1px solid var(--divider); border-radius: 6px;
      font-family: inherit; font-size: 15px; color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .input:focus, .select:focus {
      outline: none; border-color: var(--text);
    }

    /* Type toggle */
    .type-toggle {
      display: flex; height: 40px; overflow: hidden;
      background: #ffffff; border: 1px solid var(--divider); border-radius: 6px;
    }
    .type-toggle button {
      flex: 1; border: 0; background: transparent; cursor: pointer;
      font-size: 14px; color: var(--secondary);
    }
    .type-toggle button.active { background: var(--text); color: #ffffff; }

    /* Form footer */
    .form-footer {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 14px; min-height: 40px;
    }
    .form-error { font-size: 13px; color: var(--danger); }
    .btn-primary {
      height: 40px; padding: 0 24px;
      background: var(--text); color: #ffffff; border: 0; border-radius: 6px;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .btn-primary:hover { background: #2a2a2a; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    /* List */
    .list { border-top: 1px solid var(--divider); }
    .list-row {
      display: grid;
      grid-template-columns: 110px 56px 110px 130px 1fr 36px;
      gap: 12px; align-items: center;
      padding: 14px 0; border-bottom: 1px solid var(--divider);
      font-size: 14px;
    }
    .list-row.empty {
      grid-template-columns: 1fr;
      color: var(--secondary); padding: 32px 0; text-align: center;
    }
    .col-date { color: var(--secondary); font-variant-numeric: tabular-nums; }
    .col-type {
      font-size: 12px; color: var(--secondary);
      padding: 2px 8px; background: var(--card); border-radius: 4px;
      text-align: center; width: fit-content;
    }
    .col-type.income { color: var(--income); }
    .col-amount {
      text-align: right;
      font-variant-numeric: tabular-nums; font-weight: 600;
    }
    .col-amount.income { color: var(--income); }
    .col-memo {
      color: var(--secondary);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .btn-del {
      width: 28px; height: 28px;
      border: 0; background: transparent;
      color: var(--secondary); cursor: pointer; border-radius: 4px;
      font-size: 18px; line-height: 1;
    }
    .btn-del:hover { background: var(--card); color: var(--danger); }

    /* Bars */
    .bars { display: flex; flex-direction: column; gap: 12px; }
    .bar-row {
      display: grid; grid-template-columns: 110px 1fr 140px;
      align-items: center; gap: 12px;
      font-size: 13px;
    }
    .bar-label { color: var(--text); }
    .bar-track {
      height: 8px; background: var(--card);
      border-radius: 4px; overflow: hidden;
    }
    .bar-fill {
      height: 100%; background: var(--text); border-radius: 4px;
      transition: width 0.2s ease;
    }
    .bar-amount {
      text-align: right; font-variant-numeric: tabular-nums;
      color: var(--secondary);
    }

    /* Loading state */
    .skeleton { color: var(--secondary); font-size: 13px; padding: 12px 0; }
  </style>
</head>
<body>
  <main>
    <!-- ────────── HEADER ────────── -->
    <header class="header">
      <div class="header-top">
        <h1 class="title">PRIME / Spend</h1>
        <div class="month" id="month">—</div>
      </div>
      <div class="summary">
        <div>
          <div class="summary-label">수입</div>
          <div class="summary-value" id="sum-income">₩0</div>
        </div>
        <div>
          <div class="summary-label">지출</div>
          <div class="summary-value" id="sum-expense">₩0</div>
        </div>
        <div>
          <div class="summary-label">잔액</div>
          <div class="summary-value" id="sum-balance">₩0</div>
        </div>
      </div>
    </header>

    <!-- ────────── INPUT ────────── -->
    <section>
      <div class="section-title">입력</div>
      <form class="form" id="form" autocomplete="off">
        <div class="form-row">
          <div class="field">
            <label class="field-label" for="f-date">날짜</label>
            <input type="date" id="f-date" class="input" required />
          </div>
          <div class="field">
            <label class="field-label">타입</label>
            <div class="type-toggle" id="type-toggle">
              <button type="button" data-type="expense" class="active">지출</button>
              <button type="button" data-type="income">수입</button>
            </div>
          </div>
          <div class="field">
            <label class="field-label" for="f-category">카테고리</label>
            <select id="f-category" class="select" required></select>
          </div>
          <div class="field">
            <label class="field-label" for="f-amount">금액 (₩)</label>
            <input type="text" id="f-amount" class="input" inputmode="numeric" placeholder="0" required />
          </div>
        </div>
        <div class="form-row form-row-full">
          <div class="field">
            <label class="field-label" for="f-memo">메모 (선택, 200자 이내)</label>
            <input type="text" id="f-memo" class="input" maxlength="200" />
          </div>
        </div>
        <div class="form-footer">
          <div class="form-error" id="f-error"></div>
          <button type="submit" class="btn-primary" id="f-submit">저장</button>
        </div>
      </form>
    </section>

    <!-- ────────── LIST ────────── -->
    <section>
      <div class="section-title">최근 입력 (이번 달, 최대 20건)</div>
      <div class="list" id="list">
        <div class="skeleton">불러오는 중…</div>
      </div>
    </section>

    <!-- ────────── BARS ────────── -->
    <section>
      <div class="section-title">카테고리별 지출 (이번 달)</div>
      <div class="bars" id="bars">
        <div class="skeleton">불러오는 중…</div>
      </div>
    </section>
  </main>

  <script>
    const API = '/api/budget';
    const $ = (id) => document.getElementById(id);
    const fmt = (n) => '₩' + new Intl.NumberFormat('ko-KR').format(n);

    function kstTodayISO() {
      // 브라우저 TZ 무관하게 KST(UTC+9) 기준 YYYY-MM-DD
      const d = new Date(Date.now() + 9 * 60 * 60 * 1000);
      return d.toISOString().slice(0, 10);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (m) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])
      );
    }

    const state = {
      type: 'expense',
      categories: { expense: [], income: [] },
      entries: [],
      stats: null,
    };

    async function loadAll() {
      try {
        const [c, e, s] = await Promise.all([
          fetch(API + '?view=categories').then((r) => r.json()),
          fetch(API + '?view=entries').then((r) => r.json()),
          fetch(API + '?view=stats').then((r) => r.json()),
        ]);
        state.categories = { expense: c.expense || [], income: c.income || [] };
        state.entries = e.items || [];
        state.stats = s;
        render();
      } catch (err) {
        showError('데이터 로드 실패: ' + err.message);
      }
    }

    function render() {
      renderHeader();
      renderCategorySelect();
      renderList();
      renderBars();
    }

    function renderHeader() {
      const s = state.stats;
      if (!s) return;
      $('month').textContent = s.month + ' · ' + (s.timezone || 'KST');
      $('sum-income').textContent = fmt(s.income_total);
      $('sum-expense').textContent = fmt(s.expense_total);
      const balEl = $('sum-balance');
      balEl.textContent = fmt(s.balance);
      balEl.classList.toggle('neg', s.balance < 0);
    }

    function renderCategorySelect() {
      const sel = $('f-category');
      const list = state.categories[state.type] || [];
      sel.innerHTML = list
        .map((c) => `<option value="${c.id}">${escapeHtml(c.name)}</option>`)
        .join('');
    }

    function renderList() {
      const list = $('list');
      if (!state.entries.length) {
        list.innerHTML = '<div class="list-row empty">이번 달 입력이 없습니다</div>';
        return;
      }
      list.innerHTML = state.entries
        .slice(0, 20)
        .map(
          (e) => `
        <div class="list-row" data-id="${e.id}">
          <div class="col-date">${e.entry_date}</div>
          <div class="col-type ${e.type}">${e.type === 'income' ? '수입' : '지출'}</div>
          <div class="col-cat">${escapeHtml(e.category_name)}</div>
          <div class="col-amount ${e.type}">${e.type === 'income' ? '+' : '-'}${fmt(e.amount).replace('₩', '₩')}</div>
          <div class="col-memo" title="${escapeHtml(e.memo || '')}">${escapeHtml(e.memo || '')}</div>
          <button class="btn-del" type="button" title="삭제" aria-label="삭제">×</button>
        </div>
      `
        )
        .join('');
      list.querySelectorAll('.btn-del').forEach((b) => {
        b.addEventListener('click', () => {
          const id = b.parentElement.dataset.id;
          onDelete(id);
        });
      });
    }

    function renderBars() {
      const bars = $('bars');
      const cats = (state.stats && state.stats.expense_by_category) || [];
      if (!cats.length) {
        bars.innerHTML = '<div class="skeleton">이번 달 지출 없음</div>';
        return;
      }
      const max = Math.max(...cats.map((c) => c.total));
      bars.innerHTML = cats
        .map((c) => {
          const w = Math.max(2, Math.round((c.total / max) * 100));
          return `
            <div class="bar-row">
              <div class="bar-label">${escapeHtml(c.category)}</div>
              <div class="bar-track"><div class="bar-fill" style="width: ${w}%"></div></div>
              <div class="bar-amount">${fmt(c.total)} · ${c.count}건</div>
            </div>
          `;
        })
        .join('');
    }

    function readForm() {
      const date = $('f-date').value;
      const type = state.type;
      const category_id = $('f-category').value;
      const amountRaw = $('f-amount').value.replace(/[^\d]/g, '');
      const amount = amountRaw ? Number(amountRaw) : 0;
      const memo = $('f-memo').value.trim() || null;
      return { entry_date: date, type, category_id, amount, memo };
    }

    function resetForm() {
      $('f-date').value = kstTodayISO();
      $('f-amount').value = '';
      $('f-memo').value = '';
      showError('');
    }

    function showError(msg) {
      $('f-error').textContent = msg || '';
    }

    // Type toggle
    $('type-toggle').addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const t = btn.dataset.type;
      state.type = t;
      $('type-toggle')
        .querySelectorAll('button')
        .forEach((b) => b.classList.toggle('active', b.dataset.type === t));
      renderCategorySelect();
    });

    // Amount comma format
    $('f-amount').addEventListener('input', (e) => {
      const raw = e.target.value.replace(/[^\d]/g, '');
      e.target.value = raw ? new Intl.NumberFormat('ko-KR').format(Number(raw)) : '';
    });

    // Submit
    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $('f-submit');
      btn.disabled = true;
      showError('');
      try {
        const data = readForm();
        if (!data.amount || data.amount <= 0) {
          showError('금액을 입력하세요');
          return;
        }
        const res = await fetch(API + '?view=entries', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        const body = await res.json();
        if (!res.ok) {
          showError(body.error || '저장 실패');
          return;
        }
        resetForm();
        await loadAll();
      } catch (err) {
        showError('네트워크 오류: ' + err.message);
      } finally {
        btn.disabled = false;
      }
    });

    async function onDelete(id) {
      if (!confirm('이 입력을 삭제할까요?')) return;
      try {
        const res = await fetch(API + '?view=entries&id=' + encodeURIComponent(id), {
          method: 'DELETE',
        });
        if (!res.ok && res.status !== 204) {
          const body = await res.json().catch(() => ({}));
          showError(body.error || '삭제 실패');
          return;
        }
        await loadAll();
      } catch (err) {
        showError('네트워크 오류: ' + err.message);
      }
    }

    // Init
    document.addEventListener('DOMContentLoaded', () => {
      $('f-date').value = kstTodayISO();
      loadAll();
    });
  </script>
</body>
</html>
