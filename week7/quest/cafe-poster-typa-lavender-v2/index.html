<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=2200, initial-scale=1" />
  <title>TYPA — Poster v2 · Lavender Angel (다크 + 라이트)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Inter:wght@300;400;500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <div class="stage">

    <!-- 다크 panel — 악마 칵테일 -->
    <article class="poster dark">
      <div class="visual">
        <img src="./assets/devil-visual.png" alt="Lavender Devil cocktail" />
      </div>

      <p class="sub">𝕷𝖆𝖛𝖊𝖓𝖉𝖊𝖗 𝕯𝖊𝖛𝖎𝖑</p>
      <h1 class="copy">세 번째 악마.</h1>

      <div class="doodles" aria-hidden="true">
        <span class="d d1">⛧</span>
        <span class="d d2">🦇</span>
        <span class="d d3">✨</span>
        <span class="d d4">🩸</span>
        <span class="d d5">⛧</span>
        <span class="d d6">🦇</span>
        <span class="d d7">✨</span>
        <span class="d d8">🩸</span>
      </div>

      <footer class="meta">
        <div class="price">₩7,500</div>
        <div class="period">2026.06 – 08 · SUMMER LIMITED</div>
        <div class="brand">TYPA</div>
      </footer>

      <div class="tone-label">DARK · for SNS</div>
    </article>

    <!-- 라이트 panel — 천사 크림 소다 -->
    <article class="poster light">
      <div class="visual">
        <img src="./assets/angel-visual.png" alt="Lavender Angel cream soda" />
      </div>

      <p class="sub">𝕷𝖆𝖛𝖊𝖓𝖉𝖊𝖗 𝕬𝖓𝖌𝖊𝖑</p>
      <h1 class="copy">세 번째 천사.</h1>

      <div class="doodles" aria-hidden="true">
        <span class="d d1">✨</span>
        <span class="d d2">🤍</span>
        <span class="d d3">☁</span>
        <span class="d d4">🪽</span>
        <span class="d d5">✨</span>
        <span class="d d6">🤍</span>
        <span class="d d7">✨</span>
        <span class="d d8">☁</span>
      </div>

      <footer class="meta">
        <div class="price">₩7,500</div>
        <div class="period">2026.06 – 08 · SUMMER LIMITED</div>
        <div class="brand">TYPA</div>
      </footer>

      <div class="tone-label">LIGHT · for PRINT</div>
    </article>

  </div>

</body>
</html>
